<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root { --bg:{{theme:nen}}; --fg:{{theme:muc}}; --accent:{{theme:nhan.0}}; --muted:{{theme:muted}}; --line:{{theme:duong}}; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-weight: 800; margin: 0 0 4px; }
  h2 { color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 40px; }
  .meta { color: var(--muted); margin: 0 0 16px; }
  pre { white-space: pre-wrap; word-wrap: break-word; background:{{theme:duyet.khung}}; padding:16px;
        border-radius:8px; font: 15px/1.6 inherit; font-family: inherit; }
  .tag { color: var(--accent); font-weight: 700; }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  a { color: var(--accent); word-break: break-all; }
  .canh-bao { border:2px solid var(--accent); border-radius:8px; padding:12px 16px; margin:16px 0; }
  .canh-bao li { margin: 4px 0; }
  .canh-bao.do { border-color: {{theme:duyet.loi}}; }
  .st-so-bo { color: var(--accent); } .st-chua-xac-minh { color: {{theme:duyet.loi}}; }
  .scroll { overflow-x: auto; }
  video { width: 100%; border-radius: 8px; background:#000; }
  .opts { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px; }
  .opt { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .opt img { width:100%; border-radius:4px; }
</style>
</head>
<body><main>
<h1>$title</h1>
<p class="meta">$meta</p>
$body
</main></body>
</html>
