<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .qt-tieu-de { position: absolute; left: 160px; top: 110px; right: 160px; color: var(--ink);
                        font: 900 68px/1.15 var(--font-display); letter-spacing: -0.01em; }
    #root .qt-khung { position: absolute; left: 160px; top: 290px; width: 1600px; height: 640px; }
    #root .qt-nut { position: absolute; top: 0; height: 100%; text-align: center; }
    #root .qt-hop { margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    #root .qt-hop img { width: 100%; height: 100%; object-fit: contain; }
    #root .qt-hop.so { background: var(--accent); color: var(--accent-ink); border-radius: 50%;
                       font: 900 150px/1 var(--font-display); }
    #root .qt-nhan { margin-top: 36px; }
    #root .qt-nhan span { display: inline-block; background: var(--ink); color: var(--tren-muc);
                          font: 800 46px/1.15 var(--font-display); padding: 14px 26px; border-radius: 14px; }
    #root .qt-nut.noi-bat .qt-nhan span { background: var(--accent); color: var(--accent-ink); }
    #root .qt-mui { position: absolute; height: 12px; background: var(--ink); border-radius: 5px;
                    transform-origin: left center; }
    #root .qt-mui::after { content: ""; position: absolute; right: -8px; top: -11px; border-left: 22px solid var(--ink);
                           border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  </style>
  <div id="root" data-composition-id="quy-trinh" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"tieu_de","type":"string","label":"Tiêu đề","default":""},{"id":"buoc","type":"string","label":"Các bước (JSON)","default":"[{\"nhan\":\"Bước 1\",\"svg\":\"\"},{\"nhan\":\"Bước 2\",\"svg\":\"\"},{\"nhan\":\"Bước 3\",\"svg\":\"\"}]"},{"id":"noi_bat","type":"number","label":"Bước nổi bật (-1 = không)","default":-1},{"id":"nguon","type":"string","label":"Ghi nguồn","default":""},{"id":"nen","type":"string","label":"Nền (toi/kem/vang)","default":"toi"},{"id":"nhip","type":"string","label":"Mốc bước (JSON)","default":"[]"},{"id":"dong","type":"string","label":"Chuyển động lặp của bước nổi bật","default":"dap"}]'>
    <div id="qt-san" class="san">
      <div id="qt-tieu-de" class="qt-tieu-de" data-var-text="tieu_de"></div>
      <div id="qt-khung" class="qt-khung" data-layout-allow-overflow></div>
      <div id="qt-nguon" class="dong-nguon" data-var-text="nguon"></div>
    </div>
  </div>
  <script>
    /*__DONG__*/
    // Các nút dựng một lần lúc khởi tạo từ biến (tất định); mọi chuyển động nằm trên timeline.
    const v = window.__hyperframes.getVariables();
    const N = JSON.parse(v.nhip || "[]"), at = (k, d) => (N[k] ?? d);
    document.querySelector("#qt-san").classList.add("nen-" + (v.nen || "toi"));
    const buoc = JSON.parse(v.buoc), n = buoc.length, hl = Number(v.noi_bat);
    const khung = document.querySelector("#qt-khung");
    const nw = 1600 / n, hop = Math.min(420, nw - 150);
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#qt-tieu-de", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0);
    const others = [];
    buoc.forEach((b, i) => {
      const t0 = at(i, 0.5 + 0.55 * i);
      const nut = document.createElement("div");
      nut.id = "qt-nut-" + i;
      nut.className = "qt-nut" + (i === hl ? " noi-bat" : "");
      nut.style.left = i * nw + "px";
      nut.style.width = nw + "px";
      const h = document.createElement("div");
      h.id = "qt-hop-" + i;
      h.className = "qt-hop";
      h.style.width = h.style.height = hop + "px";
      if (b.svg) {
        const im = document.createElement("img");
        im.src = b.svg;
        im.alt = "";
        h.appendChild(im);
      } else {
        h.classList.add("so");
        h.textContent = String(i + 1);
      }
      const nhan = document.createElement("div");
      nhan.id = "qt-nhan-" + i;
      nhan.className = "qt-nhan";
      const sp = document.createElement("span");
      sp.textContent = b.nhan;
      nhan.appendChild(sp);
      nut.append(h, nhan);
      khung.appendChild(nut);
      if (i !== hl) others.push(nut);
      tl.fromTo(h, { scale: 0, y: -40, transformOrigin: "50% 90%" }, { scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t0);
      tl.fromTo(nhan, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22 }, t0 + 0.12);
      if (i > 0) {  // mũi tên nối nút trước với nút này, mọc ra ngay trước khi nút xuất hiện
        const mui = document.createElement("div");
        mui.id = "qt-mui-" + i;
        mui.className = "qt-mui";
        mui.style.left = (i - 1) * nw + nw / 2 + hop / 2 + 8 + "px";
        mui.style.width = Math.max(30, nw - hop - 30) + "px";
        mui.style.top = hop / 2 - 5 + "px";
        khung.appendChild(mui);
        tl.fromTo(mui, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, Math.max(0.05, t0 - 0.2));
      }
    });
    const tLast = at(n - 1, 0.5 + 0.55 * (n - 1));
    if (hl >= 0 && hl < n) {  // sau khi đủ bước: các bước thường lùi lại, bước nổi bật tiếp tục chuyển động
      if (others.length) tl.fromTo(others, { opacity: 1 }, { opacity: 0.45, duration: 0.4, ease: "power2.inOut" }, tLast + 0.7);
      dongLap(tl, "#qt-hop-" + hl, v.dong, tLast + 0.8, 12);
    }
    tl.fromTo("#qt-nguon", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
    window.__timelines["quy-trinh"] = tl;
  </script>
</template>
