<template>
  <style>
    #root { position: absolute; inset: 0; background: var(--ground); overflow: hidden; }
    #root .sl-wrap { position: absolute; left: 0; right: 0; top: 0; bottom: 60px; text-align: center;
                     display: flex; flex-direction: column; justify-content: center; }
    #root .sl-so { color: var(--accent); font: 900 220px/1 var(--font-display); letter-spacing: -0.04em;
                   white-space: nowrap; }
    #root .sl-nhan { margin-top: 36px; color: var(--ink); font: 800 56px/1.15 var(--font-display); }
    #root .sl-nguon { position: absolute; left: 96px; top: 48px; color: var(--muted);
                      font: 500 28px/1.2 var(--font-display); }
  </style>
  <div id="root" data-composition-id="so-lon" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"so","type":"number","label":"Số","default":0},{"id":"truoc","type":"string","label":"Chữ trước số","default":""},{"id":"sau","type":"string","label":"Chữ sau số","default":""},{"id":"nhan","type":"string","label":"Dòng dưới","default":""},{"id":"nguon","type":"string","label":"Ghi nguồn","default":""}]'>
    <div id="sl-wrap" class="sl-wrap">
      <div id="sl-so" class="sl-so">0</div>
      <div id="sl-nhan" class="sl-nhan" data-var-text="nhan"></div>
    </div>
    <div id="sl-nguon" class="sl-nguon" data-var-text="nguon"></div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const el = document.querySelector("#sl-so"), obj = { x: 0 }, target = Number(v.so);
    const fmt = x => (v.truoc || "") + Math.round(x).toLocaleString("vi-VN") + (v.sau || "");
    el.textContent = fmt(0);

    tl.fromTo("#sl-so", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo(obj, { x: 0 }, { x: target, duration: 1.4, ease: "power2.out",
              onUpdate: () => { el.textContent = fmt(obj.x); } }, 0.1);
    tl.fromTo("#sl-nhan", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, 1.3);
    tl.fromTo("#sl-nguon", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.5);
    tl.fromTo("#sl-wrap", { scale: 1 }, { scale: 1.03, duration: 6.4, ease: "none" }, 1.6);
    window.__timelines["so-lon"] = tl;
  </script>
</template>
