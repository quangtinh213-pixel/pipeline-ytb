<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .sl-icon { display: none; }  /* hình mờ ở góc làm khung loãng (user duyệt 12/11/2026) */
    #root .sl-icon img { width: 100%; height: 100%; object-fit: contain; }
    #root .sl-wrap { position: absolute; left: 0; right: 0; top: 0; bottom: 60px; text-align: center;
                     display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #root .sl-dong { display: flex; align-items: center; gap: 28px; }
    #root .sl-so { color: var(--accent); font: 900 300px/1 var(--font-display); letter-spacing: -0.04em;
                   white-space: nowrap; }
    #root .nen-vang .sl-so, #root .nen-kem .sl-so { color: var(--ink); }
    #root .sl-muiten { width: 170px; height: 170px; }
    #root .sl-muiten img { width: 100%; height: 100%; object-fit: contain; }
    #root .sl-gach { width: 70%; max-width: 1200px; height: 14px; margin-top: 10px; background: var(--accent);
                     border-radius: 7px; transform-origin: left center; }
    #root .nen-vang .sl-gach { background: var(--ink); }
    #root .sl-nhan { margin-top: 34px; color: var(--ink); font: 800 64px/1.15 var(--font-display); max-width: 1500px; }
  </style>
  <div id="root" data-composition-id="so-lon" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"so","type":"number","label":"Số","default":0},{"id":"so_hien","type":"string","label":"Số hiện ở khung cuối","default":"0"},{"id":"tu","type":"number","label":"Giá trị bắt đầu đếm","default":0},{"id":"tu_hien","type":"string","label":"Chuỗi giá trị bắt đầu (rỗng = đếm từ 0)","default":""},{"id":"truoc","type":"string","label":"Chữ trước số","default":""},{"id":"sau","type":"string","label":"Chữ sau số","default":""},{"id":"nhan","type":"string","label":"Dòng dưới","default":""},{"id":"nguon","type":"string","label":"Ghi nguồn","default":""},{"id":"svg","type":"string","label":"Hình nền mờ","default":"assets/svg/tien.svg"},{"id":"huong","type":"string","label":"Mũi tên (len/xuong/rỗng)","default":""},{"id":"nen","type":"string","label":"Nền (toi/kem/vang)","default":"toi"},{"id":"nhip","type":"string","label":"Mốc bước (JSON)","default":"[]"},{"id":"dong","type":"string","label":"Chuyển động lặp (bob/xoay/dap/chop)","default":""}]'>
    <div id="sl-san" class="san">
      <div id="sl-icon" class="sl-icon" data-layout-ignore><img data-var-src="svg" src="assets/svg/tien.svg" alt=""></div>
      <div id="sl-wrap" class="sl-wrap">
        <div class="sl-dong">
          <div id="sl-muiten" class="sl-muiten"><img id="sl-muiten-img" src="assets/svg/mui-ten-len.svg" alt=""></div>
          <div id="sl-so" class="sl-so">0</div>
        </div>
        <div id="sl-gach" class="sl-gach"></div>
        <div id="sl-nhan" class="sl-nhan" data-var-text="nhan"></div>
      </div>
      <div id="sl-nguon" class="dong-nguon" data-var-text="nguon"></div>
    </div>
  </div>
  <script>
    /*__DONG__*/
    const v = window.__hyperframes.getVariables();
    const N = JSON.parse(v.nhip || "[]"), at = (k, d) => (N[k] ?? d);
    document.querySelector("#sl-san").classList.add("nen-" + (v.nen || "toi"));
    const mt = document.querySelector("#sl-muiten");
    if (v.huong === "xuong") document.querySelector("#sl-muiten-img").src = "assets/svg/mui-ten-xuong.svg";
    if (v.huong !== "len" && v.huong !== "xuong") mt.style.display = "none";
    const el = document.querySelector("#sl-so"), target = Number(v.so), start = v.tu_hien ? Number(v.tu) : 0, obj = { x: start };
    // Khung cuối hiện đúng chuỗi số của nguồn (không làm tròn); lúc đếm giữ cùng số chữ số thập phân.
    const hien = String(v.so_hien), dec = (hien.split(",")[1] || "").length;
    const xong = x => start <= target ? x >= target : x <= target;  // đếm lên hoặc đếm xuống
    const fmt = x => (v.truoc || "") + (xong(x) ? hien : (v.tu_hien && x === start) ? v.tu_hien : x.toLocaleString("vi-VN",
      { minimumFractionDigits: dec, maximumFractionDigits: dec })) + (v.sau || "");
    // số dài (kèm "tỷ đồng") co cỡ chữ để vừa 1700px, đo bằng chuỗi cuối cùng
    el.textContent = fmt(target);
    const rong = el.scrollWidth + (v.huong === "len" || v.huong === "xuong" ? 200 : 0);
    if (rong > 1700) el.style.fontSize = Math.floor(300 * 1700 / rong) + "px";
    el.textContent = fmt(start);
    const tl = gsap.timeline({ paused: true }), d0 = at(0, 0.05);
    tl.fromTo("#sl-icon", { x: 120, opacity: 0 }, { x: 0, opacity: 0.14, duration: 1.0, ease: "expo.out" }, 0);
    tl.fromTo("#sl-so", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0);
    tl.fromTo(obj, { x: start }, { x: target, duration: 1.3, ease: "power3.out",
              onUpdate: () => { el.textContent = fmt(obj.x); } }, d0);
    tl.fromTo("#sl-wrap", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out" }, d0 + 1.3);
    tl.to("#sl-wrap", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, d0 + 1.42);
    tl.fromTo("#sl-muiten", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, d0 + 1.3);
    tl.fromTo("#sl-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, d0 + 1.35);
    tl.fromTo("#sl-nhan", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, Math.max(at(1, 1.6), d0 + 1.3));
    tl.fromTo("#sl-nguon", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.7);
    dongLap(tl, "#sl-icon", v.dong, 1.0, 12);
    window.__timelines["so-lon"] = tl;
  </script>
</template>
