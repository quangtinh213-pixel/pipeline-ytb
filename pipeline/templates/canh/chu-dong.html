<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .cd-wrap { position: absolute; left: 220px; right: 220px; top: 0; bottom: 90px;
                     display: flex; flex-direction: column; justify-content: center; }
    #root .cd-nho { display: flex; align-items: center; gap: 22px; color: var(--accent);
                    font: 800 34px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 40px; }
    #root .nen-vang .cd-nho { color: var(--ink); }
    #root .cd-vach { width: 90px; height: 8px; border-radius: 4px; background: currentColor; transform-origin: left center; }
    #root .cd-cau { color: var(--ink); font: 900 112px/1.1 var(--font-display); letter-spacing: -0.028em; max-width: 1480px; }
    #root .cd-cau span { display: inline-block; margin-right: 0.22em; position: relative; isolation: isolate; }
    #root .cd-cau span.cd-nhan { color: var(--accent); }
    #root .nen-vang .cd-cau span.cd-nhan, #root .nen-kem .cd-cau span.cd-nhan { color: var(--ink); }
    #root .cd-gach { position: absolute; left: -0.06em; right: -0.28em; bottom: 0.04em; height: 0.3em; z-index: -1;
                     background: color-mix(in srgb, var(--accent) 34%, transparent); border-radius: 0.08em;
                     transform-origin: left center; transform: scaleX(0); }
    #root .nen-kem .cd-gach { background: color-mix(in srgb, {{theme:nhan.0}} 70%, transparent); }
    #root .nen-vang .cd-gach { background: color-mix(in srgb, {{theme:chu_tren_nhan}} 22%, transparent); }
    #root .cd-sang { position: absolute; width: 1400px; height: 1400px; left: 50%; top: 50%; margin: -700px 0 0 -700px;
                     border-radius: 50%; pointer-events: none;
                     background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 60%); }
    #root .nen-kem .cd-sang, #root .nen-vang .cd-sang { display: none; }
  </style>
  <div id="root" data-composition-id="chu-dong" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"cau","type":"string","label":"Câu chốt","default":"Câu chốt hiện từng chữ"},{"id":"nhan_tu","type":"string","label":"Cụm được nhấn (nằm trong câu)","default":""},{"id":"nho","type":"string","label":"Dòng nhỏ phía trên","default":""},{"id":"nen","type":"string","label":"Nền (toi/kem/vang)","default":"toi"},{"id":"nhip","type":"string","label":"Mốc hiện từng chữ (JSON)","default":"[]"}]'>
    <div id="cd-san" class="san" data-layout-allow-overflow>
      <div id="cd-sang" class="cd-sang" data-layout-ignore></div>
      <div class="cd-wrap">
        <div id="cd-nho" class="cd-nho"><div id="cd-vach" class="cd-vach vach-sang"></div><span id="cd-nho-chu" class="cd-nho-chu" data-var-text="nho"></span></div>
        <div id="cd-cau" class="cd-cau"></div>
      </div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    document.querySelector("#cd-san").classList.add("nen-" + (v.nen || "toi"));
    if (!String(v.nho || "").trim()) document.querySelector("#cd-nho").style.opacity = "0";
    const N = JSON.parse(v.nhip || "[]");
    const norm = s => s.toLowerCase().normalize("NFC").replace(/[.,!?:;"'()…“”‘’]/g, "");
    const tu = String(v.cau).trim().split(/\s+/);
    const nhan = String(v.nhan_tu || "").trim().split(/\s+/).filter(Boolean).map(norm);
    // vị trí cụm nhấn trong câu (khớp không phân biệt hoa thường, bỏ dấu câu)
    let a = -1;
    for (let i = 0; nhan.length && i + nhan.length <= tu.length; i++)
      if (nhan.every((w, k) => norm(tu[i + k]) === w)) { a = i; break; }
    const cau = document.querySelector("#cd-cau");
    tu.forEach((w, i) => {
      const s = document.createElement("span");
      s.id = "cd-tu-" + i; s.textContent = w;
      if (a >= 0 && i >= a && i < a + nhan.length) {
        s.className = "cd-nhan";
        s.textContent = "";  // chữ bọc riêng để tô gradient (nền tối) mà gạch dạ quang vẫn nằm dưới
        const b = document.createElement("b"); b.className = "chu-grad"; b.textContent = w; s.appendChild(b);
        const g = document.createElement("i"); g.className = "cd-gach"; g.id = "cd-gach-" + i; s.appendChild(g);
        if (i === a + nhan.length - 1) g.style.right = "-0.06em";  // chữ cuối cụm: không kéo qua khoảng trắng
      }
      cau.appendChild(s);
    });
    // câu dài: co chữ cho vừa 3 dòng
    const h = cau.scrollHeight;
    if (h > 3 * 124) cau.style.fontSize = Math.floor(112 * Math.sqrt(3 * 124 / h)) + "px";
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#cd-sang", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
    tl.fromTo("#cd-vach", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.05);
    tl.fromTo("#cd-nho-chu", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.12);
    // mỗi chữ hiện đúng lúc giọng đọc nói tới (mốc từ giong-timing), chữ chỉ mờ → rõ, không trượt
    tu.forEach((w, i) => {
      const t = N[i] ?? (0.25 + 0.08 * i);
      tl.fromTo("#cd-tu-" + i, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t);
    });
    // gạch dạ quang chạy dưới từng chữ của cụm nhấn ngay khi chữ đó hiện (cụm nhấn hay nằm cuối câu, chờ hết cụm thì không kịp thấy)
    for (let i = Math.max(a, 0); a >= 0 && i < a + nhan.length; i++)
      tl.fromTo("#cd-gach-" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, (N[i] ?? (0.25 + 0.08 * i)) + 0.08);
    window.__timelines["chu-dong"] = tl;
  </script>
</template>
