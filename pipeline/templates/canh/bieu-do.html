<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .bd-tieu-de { position: absolute; left: 160px; top: 110px; right: 160px; color: var(--ink);
                        font: 900 52px/1.15 var(--font-display); letter-spacing: -0.01em; }
    #root .bd-khung { position: absolute; left: 160px; right: 160px; top: 290px; bottom: 190px; }
    #root .bd-luoi { position: absolute; left: 0; right: 0; height: 2px; background: var(--line); }
    #root .bd-day { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--muted);
                    transform-origin: left center; }
    #root .bd-cot { position: absolute; bottom: 0; background: var(--bar); border-radius: 12px 12px 0 0;
                    transform-origin: bottom center; }
    #root .bd-cot.noi-bat { background: var(--accent); }
    #root .bd-so { position: absolute; width: 100%; text-align: center; top: -76px; color: var(--ink);
                   font: 900 52px/1 var(--font-display); white-space: nowrap; }
    #root .bd-nhan { position: absolute; width: 100%; text-align: center; bottom: -64px; color: var(--ink);
                     font: 700 32px/1.1 var(--font-display); white-space: nowrap; }
    #root .bd-chip { position: absolute; top: -150px; left: -200px; right: -200px; text-align: center; white-space: nowrap; }
    #root .bd-chip span { display: inline-block; background: var(--ink); color: var(--tren-muc);
                          font: 800 30px/1 var(--font-display); padding: 12px 20px; border-radius: 12px; }
  </style>
  <div id="root" data-composition-id="bieu-do" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"tieu_de","type":"string","label":"Tiêu đề","default":"TIÊU ĐỀ"},{"id":"nhan_x","type":"string","label":"Nhãn cột (JSON)","default":"[\"A\",\"B\"]"},{"id":"gia_tri","type":"string","label":"Giá trị (JSON)","default":"[1,2]"},{"id":"so_hien","type":"string","label":"Số hiện (JSON)","default":"[\"1\",\"2\"]"},{"id":"don_vi","type":"string","label":"Đơn vị","default":""},{"id":"noi_bat","type":"number","label":"Cột nổi bật (0-based)","default":-1},{"id":"chu_thich","type":"string","label":"Chú thích cột nổi bật","default":""},{"id":"nguon","type":"string","label":"Ghi nguồn","default":""},{"id":"nen","type":"string","label":"Nền (toi/kem/vang)","default":"toi"},{"id":"nhip","type":"string","label":"Mốc bước (JSON)","default":"[]"}]'>
    <div id="bd-san" class="san">
      <div id="bd-tieu-de" class="bd-tieu-de" data-var-text="tieu_de">TIÊU ĐỀ</div>
      <div id="bd-khung" class="bd-khung" data-layout-allow-overflow>
        <div class="bd-luoi" style="bottom: 33%"></div>
        <div class="bd-luoi" style="bottom: 66%"></div>
        <div id="bd-day" class="bd-day"></div>
      </div>
      <div id="bd-nguon" class="dong-nguon" data-var-text="nguon"></div>
    </div>
  </div>
  <script>
    // Cột dựng một lần lúc khởi tạo từ biến (tất định); mọi chuyển động nằm trên timeline.
    const v = window.__hyperframes.getVariables();
    const N = JSON.parse(v.nhip || "[]"), at = (k, d) => (N[k] ?? d);
    document.querySelector("#bd-san").classList.add("nen-" + (v.nen || "toi"));
    const labels = JSON.parse(v.nhan_x), vals = JSON.parse(v.gia_tri);
    const hl = Number(v.noi_bat), max = Math.max(...vals), n = vals.length;
    const khung = document.querySelector("#bd-khung");
    const W = 1600, gap = 0.35, colW = W / (n + (n + 1) * gap);
    const hien = JSON.parse(v.so_hien);
    const unit = v.don_vi ? " " + v.don_vi : "";
    const dec = i => (hien[i].split(",")[1] || "").length;
    const fmt = (x, i) => (x >= vals[i] ? hien[i] : x.toLocaleString("vi-VN",
      { minimumFractionDigits: dec(i), maximumFractionDigits: dec(i) })) + unit;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#bd-tieu-de", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0);
    tl.fromTo("#bd-day", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.1);
    const others = [];
    vals.forEach((val, i) => {
      const col = document.createElement("div");
      col.id = "bd-cot-" + i;
      col.className = "bd-cot" + (i === hl ? " noi-bat" : "");
      col.style.left = (gap + i * (1 + gap)) * colW + "px";
      col.style.width = colW + "px";
      col.style.height = Math.max(0.02, val / max) * 100 + "%";
      col.innerHTML = '<div class="bd-so" id="bd-so-' + i + '">' + fmt(0, i) + '</div>' +
                      '<div class="bd-nhan">' + labels[i] + '</div>' +
                      (i === hl && v.chu_thich ? '<div class="bd-chip" id="bd-chip"><span>' + v.chu_thich + '</span></div>' : "");
      khung.appendChild(col);
      if (i !== hl) others.push(col);
      const t0 = at(i, 0.4 + i * 0.18), obj = { x: 0 }, so = col.querySelector(".bd-so");
      tl.fromTo(col, { scaleY: 0 }, { scaleY: 1, duration: 0.75, ease: "back.out(1.3)" }, t0);
      tl.fromTo(obj, { x: 0 }, { x: val, duration: 0.75, ease: "power3.out",
                onUpdate: () => { so.textContent = fmt(obj.x, i); } }, t0);
    });
    // sau khi mọi cột lên: cột thường lùi lại, cột nổi bật được chú thích
    const tHl = at(n, 0.4 + n * 0.18 + 0.5);
    if (hl >= 0 && others.length) tl.fromTo(others, { opacity: 1 }, { opacity: 0.45, duration: 0.4, ease: "power2.inOut" }, tHl);
    if (document.querySelector("#bd-chip"))
      tl.fromTo("#bd-chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, tHl + 0.1);
    tl.fromTo("#bd-nguon", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
    window.__timelines["bieu-do"] = tl;
  </script>
</template>
