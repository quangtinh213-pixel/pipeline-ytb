<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .mh-the-gioi { position: absolute; inset: 0; }
    #root .mh-dat { position: absolute; left: 410px; top: 100px; width: 1100px; height: 1100px; }
    #root .mh-dat img, #root .mh-chinh img, #root .mh-phu img { width: 100%; height: 100%; object-fit: contain; }
    #root .mh-bong { position: absolute; left: 760px; top: 700px; width: 400px; height: 90px; border-radius: 50%;
                     background: rgba(0,0,0,0.35); filter: blur(18px); }
    #root .mh-chinh { position: absolute; left: 660px; top: 250px; width: 600px; height: 520px; }
    #root .mh-phu { position: absolute; width: 230px; height: 230px; }
    #root .mh-phu-1 { left: 470px; top: 560px; }
    #root .mh-phu-2 { left: 1230px; top: 590px; }
    #root .mh-nhan { position: absolute; left: 0; right: 0; top: 96px; text-align: center; }
    #root .mh-day { position: absolute; left: 958px; top: 196px; width: 4px; height: 70px; background: var(--accent);
                    transform-origin: top center; }
  </style>
  <div id="root" data-composition-id="minh-hoa" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"svg","type":"string","label":"Hình chính","default":"assets/svg/chip.svg"},{"id":"phu1","type":"string","label":"Đạo cụ trái","default":""},{"id":"phu2","type":"string","label":"Đạo cụ phải","default":""},{"id":"nhan","type":"string","label":"Nhãn","default":"NHÃN"},{"id":"nguon","type":"string","label":"Ghi nguồn","default":""},{"id":"nen","type":"string","label":"Nền (toi/kem/vang)","default":"toi"},{"id":"nhip","type":"string","label":"Mốc bước (JSON)","default":"[]"},{"id":"dong","type":"string","label":"Chuyển động lặp (bob/xoay/dap/chop/tilt/tho)","default":"bob"},{"id":"vao","type":"string","label":"Kiểu vào cảnh 0-3","default":"0"}]'>
    <div id="mh-san" class="san">
      <div id="mh-the-gioi" class="mh-the-gioi">
        <div id="mh-dat" class="mh-dat"><img src="assets/svg/nen-dat.svg" alt=""></div>
        <div id="mh-bong" class="mh-bong"></div>
        <div id="mh-phu-1" class="mh-phu mh-phu-1"><img id="mh-phu-1-img" data-var-src="phu1" src="assets/svg/cay.svg" alt=""></div>
        <div id="mh-chinh" class="mh-chinh"><img id="mh-img" data-var-src="svg" src="assets/svg/chip.svg" alt=""></div>
        <div id="mh-phu-2" class="mh-phu mh-phu-2"><img id="mh-phu-2-img" data-var-src="phu2" src="assets/svg/cay.svg" alt=""></div>
      </div>
      <div id="mh-day" class="mh-day"></div>
      <div id="mh-nhan" class="mh-nhan"><span id="mh-nhan-txt" class="nhan-pill" data-var-text="nhan">NHÃN</span></div>
      <div id="mh-nguon" class="dong-nguon" data-var-text="nguon"></div>
    </div>
  </div>
  <script>
    /*__DONG__*/
    const v = window.__hyperframes.getVariables();
    const N = JSON.parse(v.nhip || "[]"), at = (k, d) => (N[k] ?? d);
    document.querySelector("#mh-san").classList.add("nen-" + (v.nen || "toi"));
    if (!v.phu1) document.querySelector("#mh-phu-1").style.display = "none";
    if (!v.phu2) document.querySelector("#mh-phu-2").style.display = "none";
    const tl = gsap.timeline({ paused: true });
    // bốn kiểu vào cảnh xoay vòng (vao 0-3): rơi nảy, trượt chéo isometric, nở từ sàn, xếp tầng
    const vao = parseInt(v.vao || "0", 10) % 4;
    if (vao === 1) {
      tl.fromTo("#mh-dat", { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#mh-chinh", { x: 180, y: -104, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.65, ease: "back.out(1.2)" }, 0.1);
      tl.fromTo("#mh-bong", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.65, ease: "power2.out" }, 0.1);
    } else if (vao === 2) {
      tl.fromTo("#mh-dat", { scale: 0.8, opacity: 0, transformOrigin: "50% 60%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#mh-chinh", { scaleY: 0, scaleX: 0.2, transformOrigin: "50% 90%", opacity: 0 }, { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1, 0.75)" }, 0.1);
      tl.fromTo("#mh-bong", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
    } else if (vao === 3) {
      tl.fromTo(["#mh-dat", "#mh-bong", "#mh-chinh"], { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.14, ease: "power3.out" }, 0);
    } else {
      tl.fromTo("#mh-dat", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#mh-chinh", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.65, ease: "back.out(1.4)" }, 0.18);
      tl.fromTo("#mh-bong", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.4)" }, 0.18);
    }
    tl.fromTo("#mh-phu-1", { scale: 0, transformOrigin: "50% 90%" }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(1, 0.5));
    tl.fromTo("#mh-phu-2", { scale: 0, transformOrigin: "50% 90%" }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(2, 0.58));
    tl.fromTo("#mh-day", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, at(0, 0.72) - 0.1);
    tl.fromTo("#mh-nhan-txt", { opacity: 0, filter: "blur(8px)", scale: 0.92 },
              { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.22, ease: "power3.out" }, at(0, 0.72));
    tl.fromTo("#mh-nguon", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9);
    // thị sai ba lớp: nền trôi chậm nhất, vật chính vừa, đạo cụ nhanh nhất; nhãn đứng yên
    tl.to("#mh-dat", { x: -18, duration: 8.3, ease: "none" }, 0.7);
    tl.to("#mh-chinh", { x: -36, duration: 8.1, ease: "none" }, 0.9);
    tl.to("#mh-phu-1, #mh-phu-2", { x: -54, duration: 8, ease: "none" }, 1.0);
    dongLap(tl, "#mh-chinh", v.dong, 0.9, 12);
    dongLap(tl, "#mh-phu-1", v.dong ? "bob" : "", 1.0, 12, 0.4);
    dongLap(tl, "#mh-phu-2", v.dong ? "bob" : "", 1.1, 12, 0.8);
    window.__timelines["minh-hoa"] = tl;
  </script>
</template>
