[project]
name = "tttc"
version = "0.1.0"
description = "Pipeline video tự động – Nhịp Công Nghệ"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pillow>=11",
  "keyring>=25",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  # shortcut: máy Intel Mac, cryptography>=49 không còn wheel x86_64; bỏ ràng buộc khi đổi máy Apple Silicon
  "cryptography<49",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tttc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
